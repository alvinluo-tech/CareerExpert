<!DOCTYPE html>
<!-- ⚠️ 简历 HTML 模板 — ATS 安全设计(来自开源项目调研教训,见 docs/DESIGN.md):
     单栏、无表格/文本框/图标/照片栏、标准语义标签(h1/h2/ul)、系统字体。
     使用方式(agent 执行):复制本文件到 resumes/by-family/,把 {{TOKEN}} 替换为
     简历 markdown 对应内容(纯文本,不用 markdown 语法),然后无头渲染 PDF:
     "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless
       --disable-gpu --no-pdf-header-footer
       --print-to-pdf="输出.pdf" "file:///<本文件的绝对路径>"
     渲染后必须验证:python -c "import fitz; d=fitz.open('<输出.pdf>');
     print(len(d)); print(d[0].get_text()[:400])"
     → 页数 ≤2,且姓名/联系方式/量化数字可提取。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — 简历</title>
<style>
  /* A4 打印,页边距 1.6cm;字号 10.5pt 保证 4 年经验控制在 1~2 页 */
  @page { size: A4; margin: 1.6cm 1.7cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 10.5pt; line-height: 1.5; color: #222;
  }
  h1 { font-size: 19pt; letter-spacing: 2px; color: #111; }
  .contact { margin: 4pt 0 2pt; color: #444; font-size: 10pt; }
  h2 {
    font-size: 11.5pt; margin: 11pt 0 5pt; padding-bottom: 2.5pt;
    border-bottom: 1.5pt solid #2b4a6f; color: #2b4a6f;
    letter-spacing: 1px;
  }
  h3 { font-size: 10.5pt; margin: 7pt 0 2pt; color: #111; }
  h3 .meta { font-weight: normal; color: #555; }
  ul { padding-left: 14pt; }
  li { margin-bottom: 2.5pt; }
  .summary { text-align: justify; }
  .skills li { margin-bottom: 1.5pt; }
</style>
</head>
<body>

<h1>{{NAME}}</h1>
<p class="contact">{{CONTACT_LINE}}</p>

<h2>概述</h2>
<p class="summary">{{SUMMARY}}</p>

<h2>工作经历</h2>
<!-- 每段经历一个 h3 + ul;h3 内公司/职位加粗,时间与部门用 span.meta -->
<h3>{{COMPANY_1}} <span class="meta">| {{ROLE_1}} | {{PERIOD_1}}</span></h3>
<ul>
  <li>{{BULLET}}</li>
</ul>

<h2>项目经历</h2>
<h3>{{PROJECT_1}} <span class="meta">| {{PERIOD_P1}} | {{ROLE_P1}}</span></h3>
<ul>
  <li>{{BULLET}}</li>
</ul>

<h2>技能</h2>
<ul class="skills">
  <li>{{SKILL_LINE}}</li>
</ul>

<h2>教育经历</h2>
<h3>{{SCHOOL}} <span class="meta">| {{MAJOR}} | {{DEGREE}} | {{EDU_PERIOD}}</span></h3>

</body>
</html>
