<!DOCTYPE html>
<!-- ⚠️ 简历模板 v3「主流规整版」— 基于 2025-2026 主流模板调研综合设计,当前默认推荐。
     主流规律依据(详见 docs/DESIGN.md「主流简历设计调研」):
     - 节标题与正文必须强区隔 → 全宽分隔线(超级简历/五百丁/Zety 主流手法,
       也是 v2 左色条被否掉的教训:色条不如全宽线规整)
     - 姓名区大字 + 主色粗线收尾,与正文分区(v1/v2 共有,保留)
     - 日期右对齐 + 全库格式一致(Yale: date formatting consistency)
     - 单栏、标准节名、正文黑、单一主色只用于标题与线条、无表格/图标/照片
     - 设计变量集中在 :root,改风格不动结构 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — 简历</title>
<style>
  :root {
    --accent: #14548c;   /* 主色:标题/粗线(换风格改这里) */
    --ink: #1c2430;      /* 正文 */
    --muted: #5a6472;    /* 次要信息 */
    --rule: #c9d2db;     /* 全宽细分隔线 */
    --fs: 10.5pt;        /* 正文,主流 10.5~12pt */
    --lh: 1.5;           /* 行距,按填充率微调 */
    --sec-gap: 12pt;     /* 节间距 */
  }
  @page { size: A4; margin: 1.5cm 1.6cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: var(--fs); line-height: var(--lh); color: var(--ink);
  }

  /* 姓名区:大字 + tagline + 联系行,主色粗线收尾(与正文的第一次分区) */
  h1 { font-size: 20pt; letter-spacing: 3px; color: var(--ink); }
  .tagline { margin-top: 3pt; color: var(--accent); font-weight: bold; letter-spacing: 0.5px; }
  .contact { margin-top: 4pt; padding-bottom: 8pt; color: var(--muted); font-size: 9.5pt;
             border-bottom: 2pt solid var(--accent); }

  /* 节标题:主色加粗 + 全宽分隔线(主流规整手法,与每条内容横向对齐) */
  h2 {
    font-size: 11.5pt; color: var(--accent); letter-spacing: 2px;
    margin: var(--sec-gap) 0 6pt; padding-bottom: 3pt;
    border-bottom: 1pt solid var(--rule); line-height: 1.25;
  }

  /* 条目标题:主体居左、日期右对齐(float 不改文本流,解析安全) */
  h3 { font-size: 10.8pt; margin: 6.5pt 0 2.5pt; }
  h3 .meta { font-weight: normal; font-size: 9.8pt; color: var(--muted); }
  h3 .date { float: right; font-weight: normal; font-size: 9.8pt; color: var(--muted); }
  ul { padding-left: 13pt; }
  li { margin-bottom: 3pt; text-align: justify; }
  .summary { text-align: justify; }
  .skills li { margin-bottom: 2pt; }
  .skills b { color: var(--ink); }
</style>
</head>
<body>

<h1>{{NAME}}</h1>
<p class="tagline">{{TAGLINE}}</p>
<p class="contact">{{CONTACT_LINE}}</p>

<h2>概述</h2>
<p class="summary">{{SUMMARY}}</p>

<h2>工作经历</h2>
<h3>{{COMPANY_1}} <span class="meta">| {{ROLE_1}}</span> <span class="date">{{PERIOD_1}}</span></h3>
<ul>
  <li>{{BULLET}}</li>
</ul>

<h2>项目经历</h2>
<h3>{{PROJECT_1}} <span class="meta">| {{ROLE_P1}}</span> <span class="date">{{PERIOD_P1}}</span></h3>
<ul>
  <li>{{BULLET}}</li>
</ul>

<h2>技能</h2>
<ul class="skills">
  <li><b>{{SKILL_CAT}}:</b>{{SKILL_DETAIL}}</li>
</ul>

<h2>教育经历</h2>
<h3>{{SCHOOL}} <span class="meta">| {{MAJOR}} · {{DEGREE}}</span> <span class="date">{{EDU_PERIOD}}</span></h3>

</body>
</html>
