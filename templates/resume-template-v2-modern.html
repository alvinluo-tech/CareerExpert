<!DOCTYPE html>
<!-- ⚠️ 简历模板 v2「现代版」— 比 v1 经典版更强的视觉层级,仍保持 ATS 安全:
     - 单栏正文、语义标签、无表格/图标/照片(与 v1 同约束)
     - 升级点:姓名区留白加大、节标题改为左侧色条+加宽字距、
       日期右对齐(float,文本流顺序不变所以解析安全)、行距与条目节奏更紧凑
     - 设计变量集中在 :root 的 CSS 变量,改样式只动这里:
       --accent 主色 / --ink 正文色 / --muted 次要信息色 / --fs 正文字号 /
       --lh 行距 / --sec-gap 节间距
     - 渲染与验证命令同 v1(见 templates/resume-template.html 头注释):
       Edge/Chrome --headless --print-to-pdf → PyMuPDF 查页数+字段提取 → 视觉验收 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — 简历</title>
<style>
  :root {
    --accent: #14548c;      /* 主色:节标题/分隔条(想换风格只改这里,如 teal #0f6b6b) */
    --ink: #1c2430;         /* 正文 */
    --muted: #5a6472;       /* 次要信息:日期/地点 */
    --line: #d7dde4;        /* 细分隔线 */
    --fs: 10.5pt;           /* 正文字号;内容多降到 10pt,内容少升到 11pt */
    --lh: 1.48;             /* 行距 */
    --sec-gap: 12pt;        /* 节间距 */
  }
  @page { size: A4; margin: 1.5cm 1.6cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: var(--fs); line-height: var(--lh); color: var(--ink);
  }

  /* —— 姓名区:大字 + 一行元信息,留白给足,第一眼建立层级 —— */
  h1 { font-size: 21pt; letter-spacing: 3px; color: var(--ink); }
  .tagline { margin-top: 3pt; font-size: 10.5pt; color: var(--accent); font-weight: bold; letter-spacing: 0.5px; }
  .contact { margin-top: 5pt; padding-bottom: 9pt; color: var(--muted); font-size: 9.5pt;
             border-bottom: 2.2pt solid var(--accent); }

  /* —— 节标题:左侧色条 + 加宽字距,比下划线式更现代 —— */
  h2 {
    font-size: 11.5pt; color: var(--accent); letter-spacing: 2.5px;
    margin: var(--sec-gap) 0 5pt; padding-left: 7pt;
    border-left: 3.2pt solid var(--accent); line-height: 1.25;
  }

  /* —— 条目标题:主体居左,日期右对齐(float 不改变文本流顺序,解析安全) —— */
  h3 { font-size: 10.8pt; margin: 7pt 0 2.5pt; }
  h3 .meta { font-weight: normal; font-size: 9.8pt; color: var(--muted); }
  h3 .date { float: right; font-weight: normal; font-size: 9.8pt; color: var(--muted); }
  ul { padding-left: 13pt; }
  li { margin-bottom: 2.8pt; text-align: justify; }
  .summary { text-align: justify; }
  .skills li { margin-bottom: 2pt; }
  /* 技能行:主干加粗,紧跟明细,一行为一组,扫描效率高 */
  .skills b { color: var(--ink); }
</style>
</head>
<body>

<h1>{{NAME}}</h1>
<p class="tagline">{{TAGLINE}}</p>
<p class="contact">{{CONTACT_LINE}}</p>

<h2>概述</h2>
<p class="summary">{{SUMMARY}}</p>

<h2>工作经历</h2>
<h3>{{COMPANY_1}} <span class="meta">| {{ROLE_1}}</span> <span class="date">{{PERIOD_1}}</span></h3>
<ul>
  <li>{{BULLET}}</li>
</ul>

<h2>项目经历</h2>
<h3>{{PROJECT_1}} <span class="meta">| {{ROLE_P1}}</span> <span class="date">{{PERIOD_P1}}</span></h3>
<ul>
  <li>{{BULLET}}</li>
</ul>

<h2>技能</h2>
<ul class="skills">
  <li><b>{{SKILL_CAT}}:</b>{{SKILL_DETAIL}}</li>
</ul>

<h2>教育经历</h2>
<h3>{{SCHOOL}} <span class="meta">| {{MAJOR}} · {{DEGREE}}</span> <span class="date">{{EDU_PERIOD}}</span></h3>

</body>
</html>
