# 简历样式配置 — resume-tailor skill 读取的唯一样式入口
# 用户可以说"换个青色/标题居中/去掉项目经历/技能放最前面/紧凑一点",
# agent 按下面 schema 修改本文件(或生成时临时覆盖),无需改模板代码。
# 三套模板(v1/v2/v3)都支持本 schema,差异只在视觉骨架。

template: v3-classic-pro        # v1-classic | v2-modern | v3-classic-pro

colors:
  accent: "#14548c"             # 主色:节标题/分隔粗线;金融领域策略会强制黑白
  ink: "#1c2430"                # 正文
  muted: "#5a6472"              # 次要信息(日期等)

header:
  align: left                   # left | center(居中是国内外通用变体)
  tagline: true                 # 姓名下的岗位定位行
  show_contact_line: true

# 模块顺序 = 渲染顺序;不要的模块直接删行(内容仍须存在于素材库,只是不上简历)
sections:
  - summary
  - work
  - projects
  - skills
  - education

dates:
  align: right                  # right(右对齐,主流) | inline(跟在标题后)

density: regular                # compact(挤,2页内容压1页) | regular | airy(疏,内容少时填满版面)
                                # 映射:compact fs10pt/lh1.4 | regular fs10.5/lh1.5 | airy fs11/lh1.6
page: A4                        # A4 | letter

language: zh                    # zh | en(英文版需配合英文策略:动名词、无照+"References available")
