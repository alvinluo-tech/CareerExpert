<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 213" width="160" height="213">
  <!-- 渐变背景 (高端淡灰蓝职业摄影棚质感) -->
  <defs>
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="160" height="213" fill="url(#studio-bg)" rx="8" />

  <!-- 柔和内阴影框 -->
  <rect x="1" y="1" width="158" height="211" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="7" />

  <!-- 身体与西装大衣 (干练深色职业装) -->
  <path d="M12 213 C18 165, 45 145, 80 145 C115 145, 142 165, 148 213 Z" fill="url(#suit-grad)" />

  <!-- 白色内搭衬衫领口 -->
  <polygon points="80,145 65,185 80,213 95,185" fill="#ffffff" />
  <polygon points="80,152 70,182 80,195 90,182" fill="#f8fafc" />

  <!-- 西装翻领细节 -->
  <path d="M45 160 L68 195 L80 195 L62 152 Z" fill="#334155" />
  <path d="M115 160 L92 195 L80 195 L98 152 Z" fill="#334155" />

  <!-- 颈部 -->
  <path d="M68 115 L68 152 L92 152 L92 115 Z" fill="#fed7aa" />
  <!-- 颈部阴影 -->
  <path d="M68 128 C74 135, 86 135, 92 128 L92 142 L68 142 Z" fill="#fcd34d" opacity="0.3" />

  <!-- 头发后侧底影 -->
  <path d="M42 85 C42 135, 118 135, 118 85 Z" fill="url(#hair-grad)" />

  <!-- 面部轮廓 (鹅蛋脸，温润干练) -->
  <path d="M48 78 C48 122, 112 122, 112 78 C112 42, 48 42, 48 78 Z" fill="#ffedd5" />

  <!-- 优雅职业发型 -->
  <path d="M46 72 C46 38, 114 38, 114 72 C114 76, 110 95, 110 95 C102 55, 68 52, 50 95 C50 95, 46 76, 46 72 Z" fill="url(#hair-grad)" />

  <!-- 耳环微光点缀 -->
  <circle cx="47" cy="85" r="2.5" fill="#f59e0b" />
  <circle cx="113" cy="85" r="2.5" fill="#f59e0b" />

  <!-- 眉毛 -->
  <path d="M58 68 Q66 65 74 68" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M86 68 Q94 65 102 68" stroke="#334155" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- 眼睛 (神采奕奕) -->
  <ellipse cx="66" cy="76" rx="4" ry="2.5" fill="#1e293b" />
  <circle cx="67.5" cy="74.5" r="1.2" fill="#ffffff" />
  <ellipse cx="94" cy="76" rx="4" ry="2.5" fill="#1e293b" />
  <circle cx="95.5" cy="74.5" r="1.2" fill="#ffffff" />

  <!-- 鼻翼 -->
  <path d="M80 77 L78 87 L82 87" stroke="#fbbf24" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- 亲和自信微笑 -->
  <path d="M72 96 Q80 103 88 96" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
