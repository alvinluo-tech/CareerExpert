<section class="section-work">
  <h2>工作经历</h2>
  <!-- 单条经历骨架，按时间倒序排列 -->
  <div class="item-header">
    <div>
      <span class="item-title">{{COMPANY}}</span>
      <span class="item-role">| {{ROLE}}</span>
    </div>
    <span class="item-date">{{PERIOD}}</span>
  </div>
  <ul class="bullets">
    <!-- 每条 bullet 均须符合 Google XYZ / HBS PAR 强动词量化结构 -->
    <li>{{BULLET_1}}</li>
    <li>{{BULLET_2}}</li>
    <li>{{BULLET_3}}</li>
  </ul>
</section>
