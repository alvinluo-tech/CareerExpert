<!DOCTYPE html>
<!-- 
  简历模板 v6「极简纯粹留白款」(Minimal Clean) — 极简设计、国际化通用、UI/UX 设计师、现代产品经理
  特性：
  - 去除厚重繁复的线条与色块，完全依靠顶级字阶层次（Typography Hierarchy）与网格留白呼吸感
  - 极致耐看，高级利落，适合注重审美与现代沟通质感的岗位
  - 全量变量与模块化插槽驱动：支持自定义配色、字体大小、模块顺序
  - 严格保持单栏标准语义化，ATS 纯文本抽取 100% 安全
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — 个人简历</title>
<style>
  :root {
    --accent: #334155;       /* 极简石墨或低饱和深蓝 */
    --accent-light: #f8fafc;
    --ink: #18181b;          /* 高对比度炭黑 */
    --muted: #71717a;        /* 雅致烟灰 */
    --rule: #e4e4e7;         /* 微隐细线 */
    --fs: 10.5pt;
    --lh: 1.5;
    --sec-gap: 13pt;
  }
  @page { size: A4; margin: 1.5cm 1.6cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--fs);
    line-height: var(--lh);
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* 极简头部 */
  header {
    margin-bottom: var(--sec-gap);
    padding-bottom: 8pt;
  }
  .header-left { text-align: left; }
  .header-center { text-align: center; }
  .header-split { display: flex; justify-content: space-between; align-items: flex-end; }

  h1 {
    font-size: 21pt;
    font-weight: 750;
    letter-spacing: -0.5px;
    color: var(--ink);
    line-height: 1.1;
  }
  .tagline {
    margin-top: 3pt;
    color: var(--accent);
    font-weight: 550;
    font-size: 10.5pt;
    letter-spacing: 0.2px;
  }
  .contact {
    margin-top: 4pt;
    color: var(--muted);
    font-size: 9.3pt;
  }
  .contact-item { display: inline-block; margin: 0 4pt; }
  .contact-item:first-child { margin-left: 0; }
  .contact a { color: var(--muted); text-decoration: none; }

  /* 极简节标题：纯字阶 + 微字间距 */
  h2 {
    font-size: 11pt;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1.5px;
    margin: var(--sec-gap) 0 4pt;
    padding-bottom: 2pt;
    line-height: 1.25;
    text-transform: uppercase;
    border-bottom: 0.75pt solid var(--rule);
  }

  /* 条目标题 */
  .item-header {
    margin: 7pt 0 1.5pt;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 10.6pt;
  }
  .item-title { font-weight: 650; color: var(--ink); }
  .item-role { font-weight: 500; color: var(--muted); margin-left: 5pt; font-size: 9.8pt; }
  .item-date { font-size: 9.3pt; color: var(--muted); font-weight: normal; }

  /* 描述与 Bullet */
  p.section-desc { margin-bottom: 3.5pt; text-align: justify; }
  ul.bullets { padding-left: 13pt; margin-bottom: 3.5pt; }
  ul.bullets li { margin-bottom: 2.2pt; text-align: justify; }

  /* 技能展示 */
  .skills-category-list { list-style: none; padding-left: 0; }
  .skills-category-list li { margin-bottom: 2.5pt; }
  .skills-category-list b { color: var(--ink); margin-right: 4pt; font-weight: 600; }

  .skills-pill-badges { display: flex; flex-wrap: wrap; gap: 4pt; list-style: none; padding-left: 0; margin-top: 3pt; }
  .skills-pill-badges li {
    background: #f4f4f5;
    color: var(--ink);
    border-radius: 3pt;
    padding: 1.5pt 6pt;
    font-size: 9pt;
    font-weight: 500;
  }

  /* 荣誉资质 */
  .honor-item { display: flex; justify-content: space-between; margin-bottom: 2pt; font-size: 10pt; }
  .honor-name { font-weight: 600; color: var(--ink); }
  .honor-date { color: var(--muted); font-size: 9.2pt; }
</style>
</head>
<body>

<header class="{{HEADER_ALIGN_CLASS}}">
  <h1>{{NAME}}</h1>
  {{TAGLINE_BLOCK}}
  <div class="contact">
    {{CONTACT_LINE}}
  </div>
</header>

<!-- 乐高式插槽：按 style.yml 的 sections 顺序动态组装 -->
{{SECTIONS_CONTENT}}

</body>
</html>
