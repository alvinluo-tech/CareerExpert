<!DOCTYPE html>
<!-- 
  简历模板 v5「卓越居中对称款」(Executive Center) — 高端管理、战略咨询、科研高校教职、外企高管
  特性：
  - 优雅中轴对称排版：大姓名居中、联系方式居中流线型分布
  - 节标题带精致双侧或居中修饰细线，威严沉稳，气度不凡
  - 经历正文保持左对齐标准阅读流，兼顾对称美感与招聘官高效扫读
  - 100% 变量驱动与模块化插槽驱动，ATS 单栏无损解析
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — 个人简历</title>
<style>
  :root {
    --accent: #1e3a8a;       /* 皇家深蓝或典雅石墨 */
    --accent-light: #eff6ff;
    --ink: #0f172a;          /* 极深正文墨色 */
    --muted: #475569;        /* 辅助色 */
    --rule: #cbd5e1;         /* 细线分割 */
    --fs: 10.5pt;
    --lh: 1.5;
    --sec-gap: 13pt;
  }
  @page { size: A4; margin: 1.5cm 1.6cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Georgia", "Songti SC", "PingFang SC", "Microsoft YaHei", serif, sans-serif;
    font-size: var(--fs);
    line-height: var(--lh);
    color: var(--ink);
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* 居中头部 */
  header {
    text-align: center;
    margin-bottom: var(--sec-gap);
    padding-bottom: 7pt;
    border-bottom: 2pt solid var(--ink);
  }
  .header-left { text-align: left; }
  .header-center { text-align: center; }
  .header-split { display: flex; justify-content: space-between; align-items: flex-end; }

  h1 {
    font-size: 22pt;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--ink);
    line-height: 1.2;
    text-transform: uppercase;
  }
  .tagline {
    margin-top: 3pt;
    color: var(--accent);
    font-weight: 600;
    font-size: 10.5pt;
    letter-spacing: 1px;
  }
  .contact {
    margin-top: 5pt;
    color: var(--muted);
    font-size: 9.3pt;
  }
  .contact-item { display: inline-block; margin: 0 5pt; }
  .contact-item:first-child { margin-left: 0; }
  .contact a { color: var(--muted); text-decoration: none; }

  /* 节标题：对称平衡分割线 */
  h2 {
    font-size: 11.2pt;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    margin: var(--sec-gap) 0 6pt;
    padding-bottom: 2.5pt;
    border-bottom: 1pt solid var(--rule);
    line-height: 1.25;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* 条目标题 */
  .item-header {
    margin: 8pt 0 2pt;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 10.8pt;
  }
  .item-title { font-weight: 700; color: var(--ink); }
  .item-role { font-weight: 600; color: var(--muted); margin-left: 5pt; font-size: 10pt; }
  .item-date { font-size: 9.6pt; color: var(--muted); font-weight: 500; }

  /* 描述与 Bullet */
  p.section-desc { margin-bottom: 4pt; text-align: justify; }
  ul.bullets { padding-left: 14pt; margin-bottom: 4pt; }
  ul.bullets li { margin-bottom: 2.5pt; text-align: justify; }

  /* 技能展示 */
  .skills-category-list { list-style: none; padding-left: 0; }
  .skills-category-list li { margin-bottom: 3pt; }
  .skills-category-list b { color: var(--accent); margin-right: 4pt; }

  .skills-pill-badges { display: flex; flex-wrap: wrap; gap: 4pt; list-style: none; padding-left: 0; margin-top: 3pt; }
  .skills-pill-badges li {
    background: var(--accent-light);
    color: var(--accent);
    border: 1pt solid var(--rule);
    border-radius: 3pt;
    padding: 1.5pt 6pt;
    font-size: 9pt;
    font-weight: 600;
  }

  /* 荣誉资质 */
  .honor-item { display: flex; justify-content: space-between; margin-bottom: 2.5pt; font-size: 10.2pt; }
  .honor-name { font-weight: 600; color: var(--ink); }
  .honor-date { color: var(--muted); font-size: 9.5pt; }
</style>
</head>
<body>

<header class="{{HEADER_ALIGN_CLASS}}">
  <h1>{{NAME}}</h1>
  {{TAGLINE_BLOCK}}
  <div class="contact">
    {{CONTACT_LINE}}
  </div>
</header>

<!-- 乐高式插槽：按 style.yml 的 sections 顺序动态组装 -->
{{SECTIONS_CONTENT}}

</body>
</html>
